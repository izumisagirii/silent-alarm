# Project-wide Gradle settings.

# JVM memory for the Gradle daemon and Kotlin/R8 workers.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Cache task outputs for faster incremental builds.
org.gradle.caching=true

# Run independent tasks in parallel.
org.gradle.parallel=true

# Skip the configuration phase when build scripts haven't changed.
org.gradle.configuration-cache=true

# Non-transitive R classes: each module's R only references its own resources,
# producing smaller R classes and faster incremental builds.
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
